<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gallery">
  <title>Gallery — art-rium</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="/shared/shared.css">
  <style>
    .app { height: 100dvh; max-width: 700px; }

    /* ── Header (delta from shared.css defaults) ── */
    header { gap: 10px; }
    /* Fixed-width title next to the flex:1 search bar — cancels shared's header h1 { flex: 1 }. */
    header h1 { flex: 0 0 auto; }

    /* ── Search ── */
    .search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute; left: 11px;
      font-size: 15px; color: var(--text-dim);
      pointer-events: none;
    }

    #search-input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid transparent;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      padding: 9px 34px 9px 34px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-dim); }

    .search-clear {
      position: absolute; right: 10px;
      background: none; border: none;
      color: var(--text-dim); font-size: 16px;
      cursor: pointer; padding: 0; display: none;
      -webkit-tap-highlight-color: transparent;
    }
    .search-clear.show { display: block; }

    /* ── Select-mode toggle ── */
    .select-toggle-btn {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 13px; font-weight: 600;
      padding: 7px 12px;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .select-toggle-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Count bar ── */
    .count-bar {
      padding: 6px 16px;
      font-size: 12px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Grid ── */
    .grid-wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
    }

    .grid-item {
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Image wrapper keeps the square aspect-ratio */
    .grid-img-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface2);
      aspect-ratio: 1;
      flex-shrink: 0;
      outline: 2.5px solid transparent;
      transition: outline-color 0.15s;
    }
    .grid-item.selected .grid-img-wrap {
      outline-color: var(--accent);
    }

    .grid-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s;
    }

    .grid-img-wrap .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex; align-items: flex-end; padding: 8px;
    }
    .grid-item:active .overlay { opacity: 1; }

    .grid-img-wrap .rating-badge {
      position: absolute; top: 7px; right: 7px;
      background: rgba(0,0,0,0.65);
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--accent);
      display: none;
    }
    .grid-img-wrap .rating-badge.show { display: block; }

    /* ── Select checkmark overlay ── */
    .sel-check {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .grid-item.selected .sel-check {
      opacity: 1;
      background: rgba(0,0,0,0.35);
    }

    .grid-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      padding: 0 2px 4px;
      line-height: 1.3;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .grid-title.placeholder { font-style: italic; opacity: 0.55; }

    /* ── Load more / empty / loading ── */
    .grid-footer {
      padding: 16px 0 calc(env(safe-area-inset-bottom) + 20px);
      display: flex; justify-content: center;
    }

    .load-more-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px; font-weight: 600;
      padding: 12px 28px;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .load-more-btn:active { background: var(--surface2); }
    .load-more-btn:disabled { opacity: 0.4; cursor: default; }

    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 60px 20px;
      color: var(--text-dim); text-align: center;
    }
    .empty-state .emoji { font-size: 48px; }
    .empty-state p { font-size: 15px; line-height: 1.5; }

    /* ── Bulk action bar (fixed bottom, select mode only) ── */
    .bulk-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
      background: var(--surface);
      border-top: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .bulk-bar.show { display: flex; }

    #bulk-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
    }

    /* ════════════════════════════════════════
       MODAL
    ════════════════════════════════════════ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .modal-backdrop.open { display: flex; }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      flex-shrink: 0;
    }

    .modal-close {
      background: var(--surface2); border: none;
      color: var(--text); font-size: 18px;
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-nav {
      display: flex; gap: 8px;
    }

    .nav-btn {
      background: var(--surface2); border: none;
      color: var(--text); font-size: 18px;
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }

    .modal-image-wrap {
      flex-shrink: 0;
      max-height: 42vh;
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px;
      overflow: hidden;
    }

    .modal-image-wrap img {
      max-width: 100%; max-height: 100%;
      border-radius: 10px;
      object-fit: contain;
      display: block;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── Desktop modal: image+sidebar split instead of stacked full-height ── */
    @media (min-width: 860px) {
      .modal-backdrop.open {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        grid-template-rows: auto 1fr;
        grid-template-areas: "header header" "image body";
      }
      .modal-header { grid-area: header; padding: 16px 24px; }
      .modal-image-wrap {
        grid-area: image;
        max-height: none;
        height: 100%;
        min-height: 0;
        padding: 24px;
      }
      .modal-image-wrap img { max-height: 100%; }
      .modal-body {
        grid-area: body;
        height: 100%;
        min-height: 0;
        padding: 20px 24px;
        background: var(--surface);
        border-left: 1px solid var(--border);
      }
    }

    /* ── Star rating ── */
    .stars-row {
      display: flex; gap: 6px;
    }

    .star {
      font-size: 28px;
      cursor: pointer;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      line-height: 1;
    }
    .star:active { transform: scale(0.88); }

    /* ── Meta row ── */
    .meta-row {
      display: flex; gap: 10px; flex-wrap: wrap;
    }

    .meta-chip {
      background: var(--surface2);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── Prompt ── */
    .prompt-block {
      background: var(--surface);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .prompt-label {
      font-size: 10px; font-weight: 700;
      color: var(--text-dim); text-transform: uppercase;
      letter-spacing: 0.7px; margin-bottom: 6px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .copy-prompt-btn {
      background: none; border: none;
      color: var(--text-dim); font-size: 13px;
      cursor: pointer; padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
      text-transform: none; letter-spacing: 0;
      font-weight: 400;
    }
    .copy-prompt-btn:active { color: var(--accent); }

    .prompt-text {
      font-size: 13px; line-height: 1.55;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .prompt-text.expanded {
      display: block;
      -webkit-line-clamp: unset;
    }

    .expand-btn {
      background: none; border: none;
      color: var(--accent); font-size: 13px;
      cursor: pointer; padding: 4px 0 0;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Tags ── */
    .section-label { font-size: 10px; letter-spacing: 0.7px; margin-bottom: 8px; }

    .tags-wrap {
      display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
    }

    .tag-chip {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface2); border-radius: 8px;
      padding: 5px 10px;
      font-size: 13px; color: var(--text);
    }

    .tag-remove {
      background: none; border: none; color: var(--text-dim);
      font-size: 14px; cursor: pointer; padding: 0; line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .tag-add-wrap {
      display: flex; gap: 6px; align-items: center;
    }

    .tag-input {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text); font-size: 14px;
      padding: 6px 10px; outline: none;
      font-family: inherit; width: 120px;
      -webkit-appearance: none;
    }
    .tag-input:focus { border-color: var(--accent); }

    .tag-add-btn {
      background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 18px; width: 34px; height: 34px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Title input ── */
    .title-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text); font-size: 14px;
      padding: 10px 14px; outline: none;
      font-family: inherit;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .title-input:focus { border-color: var(--accent); }
    .title-input::placeholder { color: var(--text-dim); }

    /* ── Notes ── */
    .notes-textarea {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text); font-size: 14px;
      padding: 12px 14px; outline: none;
      font-family: inherit; resize: none;
      min-height: 80px; line-height: 1.5;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .notes-textarea:focus { border-color: var(--accent); }

    /* ── Post-passes: auto-enhance ("Zauberstab") + film grain ──
       Both are the same control shape — a toggle button, a strength slider and
       a hold-to-compare — so they share these `.fx-*` rules and differ only in
       their glyph and their endpoints. */
    .fx-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .fx-row {
      display: flex; align-items: center; gap: 10px;
    }
    .wand-btn {
      flex-shrink: 0;
      width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 19px; line-height: 1;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .wand-btn:hover:not(:disabled) { border-color: var(--accent); }
    .wand-btn:active:not(:disabled) { transform: scale(0.94); }
    .wand-btn.on { background: var(--accent-soft); border-color: var(--accent); }
    .wand-btn:disabled { opacity: 0.5; cursor: default; }
    /* Pulses while the render runs — the pass is sub-second, so a spinner
       would flash in and out; a pulse on the control that was pressed reads
       as "working" without moving any layout. */
    .wand-btn.busy { animation: wand-pulse 0.9s ease-in-out infinite; }
    @keyframes wand-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    #enhance-strength, #grain-strength { flex: 1; min-width: 0; accent-color: var(--accent); }
    .fx-pct {
      font-size: 12px; color: var(--text-dim);
      font-variant-numeric: tabular-nums; min-width: 40px; text-align: right;
    }
    .compare-btn {
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-dim); border-radius: 7px;
      font-size: 11px; padding: 4px 8px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .compare-btn:active { color: var(--accent); border-color: var(--accent); }
    .fx-hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
    .fx-chips { display: flex; flex-wrap: wrap; gap: 4px; }

    /* ── Diffusion upscale ──
       More surface than the other two passes get, because it is the only one
       with a decision in it: how much the model is allowed to repaint. */
    .us-panel {
      display: flex; flex-direction: column; gap: 9px;
      margin-top: 8px; padding: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px;
    }
    .us-row { display: flex; align-items: center; gap: 8px; }
    .us-label { font-size: 11px; font-weight: 700; color: var(--text-dim); min-width: 46px; }
    #upscale-denoise { flex: 1; min-width: 0; accent-color: var(--accent); }
    .us-scale-ends {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--text-dim); margin-top: -4px;
    }
    .us-actions { justify-content: space-between; }
    .us-eta { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .us-progress { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
    .us-track { height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; }
    .us-fill { height: 100%; width: 3%; background: var(--accent); transition: width 0.4s ease; }
    .us-detail { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .fx-chip {
      font-size: 10px; padding: 2px 6px; border-radius: 5px;
      background: var(--surface2); color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ── Title row: input + AI suggestion button ── */
    .title-row { display: flex; align-items: center; gap: 8px; }
    .title-row .title-input { flex: 1; min-width: 0; }

    /* ── Title suggestions overlay (the Titler, in place) ──
       Above the detail modal (z-index 100) so it can be opened from inside it
       without the modal having to give up focus or scroll position. */
    #titler-modal {
      display: none; position: fixed; inset: 0; z-index: 210;
      background: rgba(0,0,0,0.72);
      align-items: flex-end; justify-content: center;
      padding-top: env(safe-area-inset-top);
    }
    #titler-modal.show { display: flex; }
    .titler-sheet {
      width: 100%; max-width: 480px;
      background: var(--surface);
      border: 1.5px solid var(--border); border-bottom: none;
      border-radius: 18px 18px 0 0;
      padding: 18px 18px calc(env(safe-area-inset-bottom) + 20px);
      display: flex; flex-direction: column; gap: 14px;
      max-height: 88dvh; overflow-y: auto;
    }
    .titler-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .titler-head h2 { font-size: 16px; font-weight: 700; }
    .titler-list { display: flex; flex-direction: column; gap: 8px; }
    .title-suggestion {
      text-align: left; width: 100%;
      background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-size: 15px; line-height: 1.35; font-family: inherit;
      padding: 12px 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .title-suggestion:hover { border-color: var(--accent); }
    .title-suggestion:active { background: var(--accent-soft); border-color: var(--accent); }
    .titler-status {
      font-size: 13px; color: var(--text-dim); line-height: 1.5;
      padding: 18px 4px; text-align: center;
    }
    .titler-status.error { color: var(--red); }
    /* The VLM takes seconds, not milliseconds — a pulse on the panel is what
       says "still thinking" without a spinner jumping the layout. */
    .titler-status.busy { animation: wand-pulse 1.1s ease-in-out infinite; }
    .titler-actions { display: flex; gap: 10px; }
    .titler-actions .btn { flex: 1; }

    /* Centred dialog rather than a bottom sheet once there is room for one. */
    @media (min-width: 860px) {
      #titler-modal { align-items: center; }
      .titler-sheet { border-radius: 16px; border-bottom: 1.5px solid var(--border); padding-bottom: 18px; }
    }

    /* ── Action buttons ── */
    .action-row {
      display: flex; gap: 10px;
    }

    /* ── Video grid items ── */
    .video-grid-item {
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .video-thumb-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 1;
    }
    .video-thumb-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-thumb-wrap .play-badge {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      pointer-events: none;
    }
    .video-grid-item .grid-title { font-size: 12px; color: var(--text-dim); padding: 0 2px 4px; }
    /* Placeholder when no thumb */
    .video-thumb-no-thumb {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; background: var(--surface2);
    }

    /* ── Video detail sheet ── */
    #video-detail-modal {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7);
      align-items: flex-end;
    }
    #video-detail-modal.show { display: flex; }
    .video-detail-sheet {
      width: 100%; max-width: 700px; margin: 0 auto;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(env(safe-area-inset-bottom) + 24px);
      display: flex; flex-direction: column; gap: 14px;
      max-height: 90dvh; overflow-y: auto;
    }
    .vd-header { display: flex; justify-content: space-between; align-items: center; }
    .vd-header h2 { font-size: 16px; font-weight: 700; }
    .vd-close { background: var(--surface2); border: none; color: var(--text); font-size: 16px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    video.vd-player { width: 100%; border-radius: 12px; background: #000; max-height: 340px; }
    .vd-chips { display: flex; gap: 7px; flex-wrap: wrap; }
    .vd-chip { background: var(--surface2); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--text-dim); }
    .vd-prompt { background: var(--surface2); border-radius: 10px; padding: 11px 13px; font-size: 13px; color: var(--text); line-height: 1.55; }
    .vd-actions { display: flex; gap: 8px; }
    .vd-btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: center; text-decoration: none; }
    .vd-btn.download { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
    .vd-btn.delete { background: rgba(255,69,58,0.1); color: var(--red); border: 1.5px solid rgba(255,69,58,0.2); }

    /* ── Desktop / wide-viewport layout ──
       Mobile stays untouched below this breakpoint; above it we widen the
       shell and let the grid use the extra horizontal space. Placed last so
       it wins the cascade over the equal-specificity mobile rules above. */
    @media (min-width: 860px) {
      .app { max-width: 1600px; }
      header { padding: 18px 28px; }
      .search-wrap { flex: 0 1 520px; margin: 0 auto; }
      .filter-bar { padding: 12px 28px; }
      .count-bar { padding: 8px 28px; }
      .grid-wrap { padding: 16px 28px 0; }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 200px));
        gap: 14px;
      }
      .video-detail-sheet { max-width: 760px; }
      video.vd-player { max-height: min(70vh, 640px); }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <a class="back-btn" href="/" title="Dashboard">‹</a>
    <h1>Gallery</h1>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="search" placeholder="Search prompts…"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <button class="select-toggle-btn" id="select-btn" onclick="toggleSelectMode()">Select</button>
  </header>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-chip active" data-rating="" onclick="setRatingFilter(this)">All</button>
    <button class="filter-chip" data-rating="5" onclick="setRatingFilter(this)">★ 5</button>
    <button class="filter-chip" data-rating="4" onclick="setRatingFilter(this)">★ 4+</button>
    <button class="filter-chip" data-rating="3" onclick="setRatingFilter(this)">★ 3+</button>
    <button class="filter-chip" data-rating="unrated" onclick="setRatingFilter(this)">Unrated</button>
    <button class="filter-chip" id="videos-chip" data-rating="" onclick="toggleVideoMode(this)">▶ Videos</button>
  </div>

  <div class="count-bar" id="count-bar"></div>

  <div class="grid-wrap" id="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="grid-footer" id="grid-footer" style="display:none">
      <button class="load-more-btn" id="load-more-btn" onclick="loadMore()">Load more</button>
    </div>
  </div>

  <!-- Bulk action bar — shown in select mode -->
  <div class="bulk-bar" id="bulk-bar">
    <span id="bulk-count">0 selected</span>
    <button class="btn danger" id="bulk-delete-btn" onclick="bulkDelete()" disabled>Delete</button>
  </div>

</div>

<!-- ── Detail Modal ── -->
<div class="modal-backdrop" id="modal">
  <div class="modal-header">
    <div class="modal-nav">
      <button class="nav-btn" id="nav-prev" onclick="navigate(-1)" title="Previous">‹</button>
      <button class="nav-btn" id="nav-next" onclick="navigate(1)"  title="Next">›</button>
    </div>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>

  <div class="modal-image-wrap">
    <img id="modal-img" src="" alt="">
  </div>

  <div class="modal-body">

    <!-- Auto-enhance ("Zauberstab") -->
    <div>
      <div class="section-label fx-head">
        <span>Verbessern</span>
        <!-- Holds the layer below the wand: the upscale when there is one,
             the original otherwise — so what you see is this pass alone. -->
        <button class="compare-btn" id="compare-btn" style="display:none">Ohne Korrektur halten</button>
      </div>
      <div class="fx-row">
        <button class="wand-btn" id="wand-btn" onclick="onWand()" title="Automatisch verbessern">🪄</button>
        <input type="range" id="enhance-strength" min="0" max="150" step="5" value="100" style="display:none">
        <span class="fx-pct" id="enhance-pct" style="display:none">100%</span>
      </div>
      <div class="fx-hint" id="enhance-hint"></div>
      <div class="fx-chips" id="enhance-chips"></div>
    </div>

    <!-- Film grain -->
    <div>
      <div class="section-label fx-head">
        <span>Körnung</span>
        <button class="compare-btn" id="grain-compare-btn" style="display:none">Ohne Korn halten</button>
      </div>
      <div class="fx-row">
        <button class="wand-btn" id="grain-btn" onclick="onGrainWand()" title="Filmkorn hinzufügen">🎞</button>
        <input type="range" id="grain-strength" min="0" max="100" step="5" value="30" style="display:none">
        <span class="fx-pct" id="grain-pct" style="display:none">30%</span>
      </div>
      <div class="fx-hint" id="grain-hint"></div>
    </div>

    <!-- Diffusion upscale (Z-Image Turbo + Ultimate SD Upscale) -->
    <div>
      <div class="section-label fx-head">
        <span>Vergrößern</span>
        <button class="compare-btn" id="upscale-compare-btn" style="display:none">Klein halten</button>
      </div>
      <div class="fx-row">
        <button class="wand-btn" id="upscale-btn" onclick="onUpscaleClick()" title="Bild vergrößern">⤢</button>
        <span class="fx-pct" id="upscale-size"></span>
      </div>
      <div class="us-panel" id="upscale-panel" style="display:none">
        <div class="us-row">
          <span class="us-label">Größe</span>
          <span class="fx-chips" id="upscale-scales"></span>
        </div>
        <div class="us-row">
          <span class="us-label">Modell</span>
          <span class="fx-chips" id="upscale-models"></span>
        </div>
        <div class="us-row">
          <span class="us-label">Stil</span>
          <input type="range" id="upscale-denoise" min="10" max="45" step="1" value="25">
          <span class="fx-pct" id="upscale-denoise-val">0.25</span>
        </div>
        <div class="us-scale-ends">
          <span>← Mehr Konsistenz</span><span>Mehr Kreativität →</span>
        </div>
        <div class="us-row us-actions">
          <span class="us-eta" id="upscale-eta"></span>
          <button class="chip-btn apply" id="upscale-run" onclick="runUpscale()">Vergrößern</button>
        </div>
      </div>
      <div class="us-progress" id="upscale-progress" style="display:none">
        <div class="us-track"><div class="us-fill" id="upscale-fill"></div></div>
        <div class="us-detail" id="upscale-detail"></div>
      </div>
      <div class="fx-hint" id="upscale-hint"></div>
    </div>

    <!-- Title -->
    <div>
      <div class="section-label">Title</div>
      <div class="title-row">
        <input class="title-input" id="modal-title" placeholder="No title yet…"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="wand-btn" id="titler-btn" onclick="openTitler()"
                title="Titel vorschlagen lassen">✨</button>
      </div>
    </div>

    <!-- Rating -->
    <div>
      <div class="section-label">Rating</div>
      <div class="stars-row" id="stars-row">
        <span class="star" data-v="1" onclick="setRating(1)">☆</span>
        <span class="star" data-v="2" onclick="setRating(2)">☆</span>
        <span class="star" data-v="3" onclick="setRating(3)">☆</span>
        <span class="star" data-v="4" onclick="setRating(4)">☆</span>
        <span class="star" data-v="5" onclick="setRating(5)">☆</span>
      </div>
    </div>

    <!-- Prompt -->
    <div class="prompt-block" id="prompt-block" style="display:none">
      <div class="prompt-label">
        <span>Prompt</span>
        <button class="copy-prompt-btn" onclick="copyPrompt()" title="Copy prompt">Copy</button>
      </div>
      <div class="prompt-text" id="modal-prompt"></div>
      <button class="expand-btn" id="expand-btn" onclick="togglePrompt()">Show more</button>
    </div>

    <!-- Meta -->
    <div class="meta-row" id="modal-meta"></div>

    <!-- Tags -->
    <div>
      <div class="section-label">Tags</div>
      <div class="tags-wrap" id="tags-wrap">
        <div class="tag-add-wrap">
          <input class="tag-input" id="tag-input" placeholder="add tag…"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 onkeydown="onTagKey(event)">
          <button class="tag-add-btn" onclick="addTag()" title="Add tag">+</button>
        </div>
      </div>
    </div>

    <!-- Notes -->
    <div>
      <div class="section-label">Notes</div>
      <textarea class="notes-textarea" id="modal-notes" placeholder="Personal notes…"></textarea>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button class="btn danger" id="delete-btn" onclick="confirmDelete()">Delete</button>
      <button class="btn primary" id="save-btn" onclick="saveModal()">Save</button>
    </div>

  </div>
</div>

<!-- ── Video Detail Sheet ── -->
<div id="video-detail-modal" onclick="closeVideoDetail(event)">
  <div class="video-detail-sheet" onclick="event.stopPropagation()">
    <div class="vd-header">
      <h2 id="vd-title">Video</h2>
      <button class="vd-close" onclick="closeVideoDetail()">✕</button>
    </div>
    <video class="vd-player" id="vd-player" controls playsinline preload="metadata"></video>
    <div class="vd-chips" id="vd-chips"></div>
    <input class="title-input" id="vd-title-input" placeholder="No title yet…" maxlength="255">
    <textarea class="notes-textarea" id="vd-notes-input" placeholder="Notes…" rows="3"></textarea>
    <div class="vd-prompt" id="vd-prompt" style="display:none"></div>
    <div style="font-size:12px;color:var(--text-dim)" id="vd-date"></div>
    <div class="vd-actions">

      <button class="vd-btn delete" id="vd-delete" onclick="deleteActiveVideo()">Delete</button>

<!-- ── Title suggestions (the Titler, opened from the title field) ── -->
<div id="titler-modal" onclick="closeTitler(event)">
  <div class="titler-sheet" onclick="event.stopPropagation()">
    <div class="titler-head">
      <h2>Titelvorschläge</h2>
      <button class="modal-close" onclick="closeTitler()">✕</button>
    </div>
    <div id="titler-body"></div>
    <div class="titler-actions">
      <button class="btn" id="titler-regen-btn" onclick="runTitler()">↻ Neue Vorschläge</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/shared/shared.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════
const PAGE_SIZE = 50;

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const state = {
  apiKey:     ArtRium.getApiKey(),
  images:     [],
  offset:     0,
  hasMore:    false,
  loading:    false,
  selectMode: false,
  selection:  new Set(),   // Set of image IDs (strings)
  filters: {
    search:    '',
    ratingMin: '',
  },
  modal: {
    index:  -1,
    image:  null,
    rating: null,
    tags:   [],
    dirty:  false,
  },
};

// ══════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

const withAuth  = (url) => ArtRium.withAuth(url, state.apiKey);
const apiFetch  = ArtRium.makeApiFetch(() => state.apiKey);

// filename → short button label, from GET /api/loras (SSOT: core/loras.py)
let loraLabelByFilename = {};
async function loadLoraLabels() {
  try {
    const r = await apiFetch('/api/loras');
    const d = await r.json();
    loraLabelByFilename = Object.fromEntries((d.loras || []).map(l => [l.filename, l.label]));
  } catch (_) { /* chips fall back to the raw filename */ }
}

const formatDate = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' })
    + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
};

// ══════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════
const buildUrl = (offset) => {
  const p = new URLSearchParams({ limit: PAGE_SIZE, offset });
  if (state.filters.search) p.set('search', state.filters.search);
  if (state.filters.ratingMin && state.filters.ratingMin !== 'unrated') {
    p.set('rating_min', state.filters.ratingMin);
  }
  return '/api/images?' + p.toString();
};

const fetchImages = async (reset = false) => {
  if (state.loading) return;
  state.loading = true;

  if (reset) {
    state.images = [];
    state.offset = 0;
    $('grid').innerHTML = '';
    $('grid-footer').style.display = 'none';
  }

  try {
    const r = await apiFetch(buildUrl(state.offset));
    let data = await r.json();

    // Client-side filter for unrated
    if (state.filters.ratingMin === 'unrated') {
      data = data.filter(img => !img.rating);
    }

    state.images.push(...data);
    state.offset += data.length;
    state.hasMore = data.length === PAGE_SIZE;

    renderImages(data, reset);
    updateCountBar();

    $('grid-footer').style.display = state.hasMore ? 'flex' : 'none';
    $('load-more-btn').disabled = false;

    if (reset && data.length === 0) renderEmpty();
  } catch (e) {
    ArtRium.toast('Failed to load images: ' + e.message, true);
  } finally {
    state.loading = false;
  }
};

const patchImage = async (id, body) => {
  const r = await apiFetch(`/api/images/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
};

const deleteImageApi = async (id) => {
  await apiFetch(`/api/images/${id}`, { method: 'DELETE' });
};

const bulkDeleteApi = async (ids) => {
  await apiFetch('/api/images', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids }),
  });
};

// ══════════════════════════════════════════════════════════
// GRID RENDERING
// ══════════════════════════════════════════════════════════
const renderImages = (images, reset) => {
  const grid = $('grid');
  images.forEach((img, localIdx) => {
    const globalIdx = reset ? localIdx : (state.images.length - images.length + localIdx);
    grid.appendChild(makeGridItem(img, globalIdx));
  });
};

const makeGridItem = (img, idx) => {
  const div = document.createElement('div');
  div.className = 'grid-item';
  div.dataset.idx = idx;
  div.dataset.id  = img.id;
  div.onclick = () => {
    if (state.selectMode) {
      toggleSelect(div, img.id);
    } else {
      openModal(idx);
    }
  };

  const wrap = document.createElement('div');
  wrap.className = 'grid-img-wrap';

  const image = document.createElement('img');
  // Use thumbnail in grid; full image loaded only in modal
  image.src = withAuth(img.thumb_url);
  image.alt = img.filename;
  image.loading = 'lazy';

  const overlay = document.createElement('div');
  overlay.className = 'overlay';

  const badge = document.createElement('div');
  badge.className = 'rating-badge' + (img.rating ? ' show' : '');
  badge.textContent = img.rating ? '★'.repeat(img.rating) : '';

  const selCheck = document.createElement('div');
  selCheck.className = 'sel-check';
  selCheck.textContent = '✓';

  wrap.appendChild(image);
  wrap.appendChild(overlay);
  wrap.appendChild(badge);
  wrap.appendChild(selCheck);
  div.appendChild(wrap);

  const titleEl = document.createElement('div');
  titleEl.className = 'grid-title' + (img.title ? '' : ' placeholder');
  titleEl.textContent = img.title || 'No title';
  div.appendChild(titleEl);

  return div;
};

const renderEmpty = () => {
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  empty.innerHTML = '<div class="emoji">🖼</div><p>No images found.<br>Try a different search or filter.</p>';
  $('grid').appendChild(empty);
};

const updateCountBar = () => {
  const bar = $('count-bar');
  if (state.images.length === 0) { bar.textContent = ''; return; }
  bar.textContent = state.hasMore
    ? `Showing ${state.images.length} images`
    : `${state.images.length} image${state.images.length === 1 ? '' : 's'}`;
};

// ══════════════════════════════════════════════════════════
// SELECT MODE
// ══════════════════════════════════════════════════════════
const toggleSelectMode = () => {
  state.selectMode = !state.selectMode;
  state.selection.clear();

  $('select-btn').classList.toggle('active', state.selectMode);
  $('select-btn').textContent = state.selectMode ? 'Cancel' : 'Select';
  $('bulk-bar').classList.toggle('show', state.selectMode);

  // Clear selected styling from all items
  $('grid').querySelectorAll('.grid-item').forEach(el => el.classList.remove('selected'));
  updateBulkBar();
};

const toggleSelect = (el, id) => {
  if (state.selection.has(id)) {
    state.selection.delete(id);
    el.classList.remove('selected');
  } else {
    state.selection.add(id);
    el.classList.add('selected');
  }
  updateBulkBar();
};

const updateBulkBar = () => {
  const n = state.selection.size;
  $('bulk-count').textContent = n === 0 ? '0 selected' : `${n} selected`;
  $('bulk-delete-btn').disabled = n === 0;
};

const bulkDelete = async () => {
  const ids = [...state.selection];
  if (ids.length === 0) return;
  if (!confirm(`Delete ${ids.length} image${ids.length === 1 ? '' : 's'}? This cannot be undone.`)) return;

  const btn = $('bulk-delete-btn');
  btn.disabled = true;

  try {
    await bulkDeleteApi(ids);

    // Remove deleted images from state and DOM
    const idSet = new Set(ids);
    state.images = state.images.filter(img => !idSet.has(img.id));
    state.offset = state.images.length;
    state.selection.clear();

    $('grid').querySelectorAll('.grid-item').forEach(el => {
      if (idSet.has(el.dataset.id)) el.remove();
    });

    reindexGrid();
    updateCountBar();
    updateBulkBar();

    if (state.images.length === 0) renderEmpty();

    ArtRium.toast(`Deleted ${ids.length} image${ids.length === 1 ? '' : 's'}`);
    // Exit select mode after bulk delete
    toggleSelectMode();
  } catch (e) {
    ArtRium.toast('Delete failed: ' + e.message, true);
    btn.disabled = false;
  }
};

// ══════════════════════════════════════════════════════════
// FILTERS
// ══════════════════════════════════════════════════════════
let searchTimer;
const onSearchInput = () => {
  const val = $('search-input').value.trim();
  $('search-clear').classList.toggle('show', val.length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.filters.search = val;
    fetchImages(true);
  }, 400);
};

const clearSearch = () => {
  $('search-input').value = '';
  $('search-clear').classList.remove('show');
  state.filters.search = '';
  fetchImages(true);
};

const setRatingFilter = (btn) => {
  if (videoMode) { videoMode = false; $('vd-player') && ($('vd-player').src = ''); }
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.filters.ratingMin = btn.dataset.rating;
  fetchImages(true);
};

const loadMore = () => {
  $('load-more-btn').disabled = true;
  fetchImages(false);
};

// ══════════════════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════════════════
const openModal = (idx) => {
  state.modal.index = idx;
  populateModal(state.images[idx]);
  $('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

const closeModal = async () => {
  if (state.modal.dirty) {
    await saveModal(true);
  }
  $('modal').classList.remove('open');
  document.body.style.overflow = '';
  state.modal.dirty = false;
};

const navigate = (dir) => {
  if (state.modal.dirty) saveModal(true);
  const next = state.modal.index + dir;
  if (next < 0 || next >= state.images.length) return;
  state.modal.dirty = false;
  openModal(next);
};

const populateModal = (img) => {
  state.modal.image  = img;
  state.modal.rating = img.rating || null;
  state.modal.tags   = img.tags ? [...img.tags] : [];

  // Full-quality image in modal — the enhanced rendition when there is one,
  // so the modal shows what publishing will use.
  $('modal-img').src = withAuth(img.primary_url || img.url);
  $('modal-img').alt = img.filename;

  renderEnhanceUI(img);
  renderGrainUI(img);
  // Opening an image whose upscale is still running has to pick the progress
  // back up — the job lives on the server, so closing the modal (or reloading)
  // never cancelled it.
  stopUpscalePolling();
  $('upscale-progress').style.display = 'none';
  $('upscale-panel').style.display = 'none';
  renderUpscaleUI(img);
  resumeUpscaleIfRunning(img.id);
  renderStars(state.modal.rating);

  const promptEl = $('modal-prompt');
  if (img.prompt) {
    $('prompt-block').style.display = 'block';
    promptEl.textContent = img.prompt;
    promptEl.classList.remove('expanded');
    $('expand-btn').textContent = 'Show more';
  } else {
    $('prompt-block').style.display = 'none';
  }

  const meta = $('modal-meta');
  meta.innerHTML = '';
  const loraChips = (img.loras || []).map(l =>
    `${loraLabelByFilename[l.name] || l.name} ${Number(l.strength).toFixed(2)}`
  );
  const chips = [
    img.width && img.height ? `${img.width}×${img.height}` : null,
    img.seed !== null && img.seed !== undefined ? `seed ${img.seed}` : null,
    ...loraChips,
    img.workflow_name || null,
    formatDate(img.created_at),
  ].filter(Boolean);
  chips.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'meta-chip';
    chip.textContent = c;
    meta.appendChild(chip);
  });

  renderTags();

  $('modal-title').value = img.title || '';
  $('modal-title').oninput = () => { state.modal.dirty = true; };

  $('modal-notes').value = img.notes || '';
  $('modal-notes').oninput = () => { state.modal.dirty = true; };

  $('nav-prev').disabled = state.modal.index <= 0;
  $('nav-next').disabled = state.modal.index >= state.images.length - 1;
};

// ══════════════════════════════════════════════════════════
// AUTO-ENHANCE ("Zauberstab")
// ══════════════════════════════════════════════════════════
// Same two-speed shape as the video tool's grain pass: dragging the slider
// renders a downscaled *preview* server-side, and only releasing it commits
// the real sibling file. Both go through the identical analyse→plan→apply
// chain, so what is judged during the drag is what gets written.
//
// It renders on top of the upscale when there is one, so playing with the wand
// on an upscaled image keeps it at its upscaled size — only the ⤢ toggle takes
// a picture back to the size it was generated at.
let enhancePreviewTimer = null;

/** Turn the applied Adjustments into short human chips ("what did it do?"). */
const enhanceParamChips = (p) => {
  if (!p) return [];
  const pct = (v) => Math.round(v * 100);
  const chips = [];
  if (p.black_point > 0 || p.white_point < 255) chips.push(`Tonwerte ${p.black_point}–${p.white_point}`);
  if (Math.abs(p.gamma - 1) > 0.01) {
    chips.push(`Belichtung ${p.gamma < 1 ? '+' : '−'}${Math.abs(pct(1 - p.gamma))}%`);
  }
  if (p.shadows    > 0.01) chips.push(`Schatten +${pct(p.shadows)}`);
  if (p.highlights > 0.01) chips.push(`Lichter −${pct(p.highlights)}`);
  if (p.contrast   > 0.01) chips.push(`Kontrast +${pct(p.contrast)}`);
  if (p.vibrance   > 0.01) chips.push(`Vibrance +${pct(p.vibrance)}`);
  if (p.definition > 0.01) chips.push(`Schärfe +${pct(p.definition)}`);
  if ((p.wb_gains || []).some(g => Math.abs(g - 1) > 0.005)) chips.push('Weißabgleich');
  return chips;
};

const renderEnhanceUI = (img) => {
  const on = !!img.enhanced;
  const strength = img.enhance_strength || 100;

  $('wand-btn').classList.toggle('on', on);
  $('enhance-strength').value = strength;
  $('enhance-pct').textContent = `${strength}%`;
  ['enhance-strength', 'enhance-pct', 'compare-btn'].forEach(id => {
    $(id).style.display = on ? '' : 'none';
  });

  $('enhance-hint').textContent = on
    ? 'Regler ändert die Stärke — 0 % entfernt die Verbesserung wieder.'
    : 'Ein Klick analysiert das Bild und räumt Tonwerte, Brillanz und Farbe auf.';
  $('enhance-chips').innerHTML = (on ? enhanceParamChips(img.enhance_params) : [])
    .map(c => `<span class="fx-chip">${ArtRium.escHtml(c)}</span>`).join('');
};

const setEnhanceBusy = (busy) => {
  $('wand-btn').classList.toggle('busy', busy);
  $('wand-btn').disabled = busy;
  $('enhance-strength').disabled = busy;
};

/** Commit `strength` (0 = remove) and adopt the returned row everywhere. */
const applyEnhance = async (strength) => {
  const img = state.modal.image;
  const idx = state.modal.index;
  setEnhanceBusy(true);
  try {
    const r = await apiFetch(`/api/images/${img.id}/enhance`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ strength }),
    });
    const updated = await r.json();
    // state.modal.image IS the array element, so this keeps the grid, the
    // modal and any later navigation on one object.
    Object.assign(img, updated);
    $('modal-img').src = withAuth(updated.primary_url);
    renderEnhanceUI(updated);
    refreshGridItem(idx, updated);
    ArtRium.toast(updated.enhanced ? 'Verbessert' : 'Verbesserung entfernt');
  } catch (e) {
    ArtRium.toast('Verbessern fehlgeschlagen: ' + e.message, true);
    renderEnhanceUI(img);   // put the slider back where the row actually is
  } finally {
    setEnhanceBusy(false);
  }
};

/** The wand itself: a toggle, like Apple's Auto button. */
const onWand = () => {
  const img = state.modal.image;
  if (!img) return;
  applyEnhance(img.enhanced ? 0 : parseInt($('enhance-strength').value, 10) || 100);
};

const previewEnhance = (strength) => {
  const img = state.modal.image;
  if (!img) return;
  clearTimeout(enhancePreviewTimer);
  // Debounced: a drag fires `input` per pixel, and every one of those would
  // otherwise be a render request.
  enhancePreviewTimer = setTimeout(() => {
    $('modal-img').src = withAuth(`/api/images/${img.id}/enhance/preview?strength=${strength}`);
  }, 130);
};

/**
 * Swap the modal image between the renditions. The stack, bottom to top, is
 *   original → upscaled → enhanced → grained
 * (services/image/rendition.py), so each compare button names the layer
 * directly *below* its own pass:
 *   unupscaled — the untouched original
 *   unenhanced — the upscale if there is one, the original otherwise
 *   ungrained  — enhanced, else upscaled, else the original
 *   primary    — what viewers actually get, i.e. the top of the stack
 */
const showRendition = (which) => {
  const img = state.modal.image;
  if (!img) return;
  // Showing the layer directly below a pass is what makes the comparison read
  // as that one pass's contribution — not the whole stack undone.
  const src = which === 'unupscaled' ? img.url
            : which === 'unenhanced' ? (img.upscaled_url || img.url)
            : which === 'ungrained'  ? (img.enhanced_url || img.upscaled_url || img.url)
            : (img.primary_url || img.url);
  $('modal-img').src = withAuth(src);
};

const initEnhanceControls = () => {
  const slider = $('enhance-strength');
  slider.addEventListener('input', () => {
    $('enhance-pct').textContent = `${slider.value}%`;
    previewEnhance(slider.value);
  });
  // `change` fires on release (and on keyboard commit), which is the point
  // where a real render is worth paying for.
  slider.addEventListener('change', () => applyEnhance(parseInt(slider.value, 10)));

  // Press-and-hold to see the picture without the correction — the upscale
  // when there is one, the untouched original otherwise. Pointer events cover
  // mouse and touch in one path; `contextmenu` is suppressed so a long press
  // on mobile compares instead of opening the image menu.
  const cmp = $('compare-btn');
  cmp.addEventListener('pointerdown', (e) => { e.preventDefault(); showRendition('unenhanced'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    cmp.addEventListener(ev, () => showRendition('primary'))
  );
  cmp.addEventListener('contextmenu', (e) => e.preventDefault());
};

// ══════════════════════════════════════════════════════════
// FILM GRAIN
// ══════════════════════════════════════════════════════════
// The same control as the wand, one layer further up: grain renders on top of
// the enhanced file when there is one and the upscale otherwise (see
// services/image/rendition.py), and removing it puts whatever was underneath
// straight back — the original when nothing else is on.
let grainPreviewTimer = null;

const GRAIN_DEFAULT = 30;

const renderGrainUI = (img) => {
  const on = !!img.grained;
  const strength = img.grain_strength || GRAIN_DEFAULT;

  $('grain-btn').classList.toggle('on', on);
  $('grain-strength').value = strength;
  $('grain-pct').textContent = `${strength}%`;
  ['grain-strength', 'grain-pct', 'grain-compare-btn'].forEach(id => {
    $(id).style.display = on ? '' : 'none';
  });

  $('grain-hint').textContent = on
    ? 'Regler ändert die Körnung — 0 % stellt den Zustand ohne Korn wieder her.'
    : 'Legt feines Filmkorn über das Bild. Das Original bleibt erhalten.';
};

const setGrainBusy = (busy) => {
  $('grain-btn').classList.toggle('busy', busy);
  $('grain-btn').disabled = busy;
  $('grain-strength').disabled = busy;
};

/** Commit `strength` (0 = remove) and adopt the returned row everywhere. */
const applyGrain = async (strength) => {
  const img = state.modal.image;
  const idx = state.modal.index;
  setGrainBusy(true);
  try {
    const r = await apiFetch(`/api/images/${img.id}/grain`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ strength }),
    });
    const updated = await r.json();
    Object.assign(img, updated);
    $('modal-img').src = withAuth(updated.primary_url);
    renderGrainUI(updated);
    refreshGridItem(idx, updated);
    ArtRium.toast(updated.grained ? 'Korn aufgelegt' : 'Korn entfernt');
  } catch (e) {
    ArtRium.toast('Körnung fehlgeschlagen: ' + e.message, true);
    renderGrainUI(img);
  } finally {
    setGrainBusy(false);
  }
};

const onGrainWand = () => {
  const img = state.modal.image;
  if (!img) return;
  applyGrain(img.grained ? 0 : parseInt($('grain-strength').value, 10) || GRAIN_DEFAULT);
};

const previewGrain = (strength) => {
  const img = state.modal.image;
  if (!img) return;
  clearTimeout(grainPreviewTimer);
  grainPreviewTimer = setTimeout(() => {
    $('modal-img').src = withAuth(`/api/images/${img.id}/grain/preview?strength=${strength}`);
  }, 130);
};

const initGrainControls = () => {
  const slider = $('grain-strength');
  slider.addEventListener('input', () => {
    $('grain-pct').textContent = `${slider.value}%`;
    previewGrain(slider.value);
  });
  slider.addEventListener('change', () => applyGrain(parseInt(slider.value, 10)));

  // Hold to see the picture without the grain — which is the enhanced
  // rendition when the wand is on, not the untouched original: the point of
  // the comparison is the grain alone.
  const cmp = $('grain-compare-btn');
  cmp.addEventListener('pointerdown', (e) => { e.preventDefault(); showRendition('ungrained'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    cmp.addEventListener(ev, () => showRendition('primary'))
  );
  cmp.addEventListener('contextmenu', (e) => e.preventDefault());
};

// ══════════════════════════════════════════════════════════
// DIFFUSION UPSCALE (Z-Image Turbo + Ultimate SD Upscale)
// ══════════════════════════════════════════════════════════
// The third pass, and the only slow one: an ESRGAN enlargement followed by a
// tiled re-diffusion, so the generator paints real detail at the new size
// instead of interpolating what is already there. Minutes on the GPU, hence a
// queued job with a polled progress bar rather than the instant round-trip the
// wand and the grain get.
//
// It is also the *bottom* of the rendition stack: it always reads the
// untouched original, and the wand and grain are re-rendered on top of the
// result when it lands. So it can be started whatever else is switched on, and
// nothing above it can cost the GPU minutes it took.
//
// The slider is the whole point of the UI. It is the sampler's denoise, named
// after what it decides: low keeps the picture and only sharpens it, high lets
// each tile repaint its contents. The range comes from the server
// (/upscale/options) so it cannot drift from services/image/upscale.py.
const usState = {
  options: null,      // /upscale/options for the open image
  scale: null,
  model: null,
  denoise: 0.25,
  pollTimer: null,
};

const renderUpscaleUI = (img) => {
  const on = !!img.upscaled;
  const running = !!usState.pollTimer;

  $('upscale-btn').classList.toggle('on', on);
  $('upscale-compare-btn').style.display = on ? '' : 'none';
  $('upscale-size').textContent = on
    ? `${img.upscale_width}×${img.upscale_height}`
    : '';

  // The panel is a decision, so it only shows while one is being made: never
  // for an image that already has an upscale, never while one is rendering.
  if (on || running) $('upscale-panel').style.display = 'none';

  $('upscale-hint').textContent = running
    ? ''
    : on
      ? `${img.upscale_scale}× · Stil ${Number(img.upscale_denoise).toFixed(2)} · `
        + `${img.upscale_model === 'nomos8ksc' ? '4x Nomos8kSC' : 'RealESRGAN 4x+'}`
        + ' — ⤢ entfernt die Vergrößerung wieder. Zauberstab und Korn bleiben erhalten.'
      : 'Vergrößert das Originalbild und zeichnet dabei echte Details nach (Z-Image, kachelweise). '
        + 'Zauberstab und Korn werden danach neu darüber gelegt. Dauert Minuten.';
};

const onUpscaleClick = async () => {
  const img = state.modal.image;
  if (!img || usState.pollTimer) return;
  if (img.upscaled) {
    if (!confirm('Vergrößerung entfernen und zum kleinen Bild zurück?')) return;
    try {
      const r = await apiFetch(`/api/images/${img.id}/upscale`, { method: 'DELETE' });
      const updated = await r.json();
      Object.assign(img, updated);
      $('modal-img').src = withAuth(updated.primary_url);
      renderUpscaleUI(updated);
      // The wand and the grain came back down to the original with it.
      renderEnhanceUI(updated);
      renderGrainUI(updated);
      refreshGridItem(state.modal.index, updated);
      ArtRium.toast('Vergrößerung entfernt');
    } catch (e) {
      ArtRium.toast('Entfernen fehlgeschlagen: ' + e.message, true);
    }
    return;
  }
  // Toggle the settings panel; load its options the first time it opens.
  const panel = $('upscale-panel');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? '' : 'none';
  if (opening) await loadUpscaleOptions(img);
};

const loadUpscaleOptions = async (img) => {
  try {
    const r = await apiFetch(`/api/images/${img.id}/upscale/options`);
    usState.options = await r.json();
  } catch (e) {
    ArtRium.toast('Optionen konnten nicht geladen werden', true);
    return;
  }
  const o = usState.options;
  usState.scale = usState.scale || o.scale_default;
  usState.model = usState.model || o.default_model;
  usState.denoise = o.denoise_default;
  $('upscale-denoise').min = Math.round(o.denoise_min * 100);
  $('upscale-denoise').max = Math.round(o.denoise_max * 100);
  $('upscale-denoise').value = Math.round(usState.denoise * 100);
  renderUpscalePanel();
};

const renderUpscalePanel = () => {
  const o = usState.options;
  if (!o) return;
  // A capped choice still shows its real output size, so "4×" that the budget
  // trimmed does not silently pretend to be 4×.
  $('upscale-scales').innerHTML = o.scales.map(s => `
    <button class="chip-btn ${s.scale === usState.scale ? 'on' : ''}"
            onclick="pickUpscaleScale(${s.scale})"
            title="${s.width}×${s.height}${s.capped ? ' (begrenzt)' : ''}">
      ${s.scale}×${s.capped ? '*' : ''}</button>`).join('');
  $('upscale-models').innerHTML = o.models.map(m => `
    <button class="chip-btn ${m.key === usState.model ? 'on' : ''}"
            onclick="pickUpscaleModel('${m.key}')" title="${m.hint}">${m.label}</button>`).join('');
  $('upscale-denoise-val').textContent = usState.denoise.toFixed(2);

  const chosen = o.scales.find(s => s.scale === usState.scale);
  $('upscale-eta').textContent = chosen
    ? `${chosen.width}×${chosen.height} · ${chosen.tiles} Kacheln · ca. ${fmtUsEta(chosen.seconds)}`
    : '';
};

const fmtUsEta = (sec) => sec < 90 ? `${Math.round(sec)} s` : `${Math.round(sec / 60)} min`;

const pickUpscaleScale = (s) => { usState.scale = s; renderUpscalePanel(); };
const pickUpscaleModel = (m) => { usState.model = m; renderUpscalePanel(); };

const runUpscale = async () => {
  const img = state.modal.image;
  if (!img) return;
  $('upscale-run').disabled = true;
  try {
    await apiFetch(`/api/images/${img.id}/upscale`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        denoise: usState.denoise, scale: usState.scale, model: usState.model,
      }),
    });
    $('upscale-panel').style.display = 'none';
    startUpscalePolling(img.id);
    ArtRium.toast('Vergrößerung gestartet');
  } catch (e) {
    ArtRium.toast('Start fehlgeschlagen: ' + e.message, true);
  } finally {
    $('upscale-run').disabled = false;
  }
};

/** Poll until the pass ends. Survives closing the modal: the job is
 *  server-side, so reopening the image picks the progress back up. */
const startUpscalePolling = (imageId) => {
  stopUpscalePolling();
  $('upscale-progress').style.display = '';
  $('upscale-btn').classList.add('busy');
  usState.pollTimer = setInterval(() => pollUpscale(imageId), 2500);
  pollUpscale(imageId);
};

const stopUpscalePolling = () => {
  clearInterval(usState.pollTimer);
  usState.pollTimer = null;
  $('upscale-btn').classList.remove('busy');
};

const pollUpscale = async (imageId) => {
  let p;
  try {
    const r = await apiFetch(`/api/images/${imageId}/upscale/progress`);
    p = await r.json();
  } catch (e) { return; }   // transient — try again next tick

  $('upscale-fill').style.width = `${Math.max(3, Math.min(100, p.pct || 0))}%`;
  $('upscale-detail').textContent = p.detail || p.message || '';

  if (p.phase === 'done' || p.phase === 'failed' || p.phase === 'idle') {
    stopUpscalePolling();
    $('upscale-progress').style.display = 'none';
    if (p.phase === 'failed') ArtRium.toast(p.message || 'Vergrößerung fehlgeschlagen', true);
    // Adopt the finished row wherever the image is on screen.
    try {
      const r = await apiFetch(`/api/images/${imageId}`);
      const updated = await r.json();
      if (state.modal.image && state.modal.image.id === imageId) {
        Object.assign(state.modal.image, updated);
        $('modal-img').src = withAuth(updated.primary_url);
        renderUpscaleUI(state.modal.image);
        // Both Pillow passes were re-rendered on top of the new upscale, so
        // the wand's chips describe the larger picture now — re-read them
        // rather than leaving the amounts the small render produced.
        renderEnhanceUI(state.modal.image);
        renderGrainUI(state.modal.image);
        refreshGridItem(state.modal.index, updated);
      }
    } catch (e) { /* the toast already said what happened */ }
    if (p.phase === 'done') ArtRium.toast('Vergrößert ✓');
  }
};

const resumeUpscaleIfRunning = async (imageId) => {
  try {
    const r = await apiFetch(`/api/images/${imageId}/upscale/progress`);
    const p = await r.json();
    // Only adopt a job that is still going; a finished entry lingers so the
    // poller can read its final state, and re-adopting it would restart the
    // bar for something already applied.
    if (['queued', 'uploading', 'submitting', 'running', 'finalizing'].includes(p.phase)
        && state.modal.image && state.modal.image.id === imageId) {
      startUpscalePolling(imageId);
    }
  } catch (e) { /* nothing running, or offline */ }
};

const initUpscaleControls = () => {
  const slider = $('upscale-denoise');
  slider.addEventListener('input', () => {
    usState.denoise = parseInt(slider.value, 10) / 100;
    $('upscale-denoise-val').textContent = usState.denoise.toFixed(2);
  });
  // Hold to see the picture at its original size — the comparison that matters
  // is the detail the pass painted, so it goes against the rendition below.
  const cmp = $('upscale-compare-btn');
  cmp.addEventListener('pointerdown', (e) => { e.preventDefault(); showRendition('unupscaled'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    cmp.addEventListener(ev, () => showRendition('primary'))
  );
  cmp.addEventListener('contextmenu', (e) => e.preventDefault());
};

// ══════════════════════════════════════════════════════════
// TITLE SUGGESTIONS (Titler)
// ══════════════════════════════════════════════════════════
// The standalone /tools/titler page runs the same endpoint; here it is an
// overlay on the title field so a title can be picked without leaving the
// image being looked at.
const titlerState = { imageId: null, busy: false };

const openTitler = () => {
  const img = state.modal.image;
  if (!img) return;
  $('titler-modal').classList.add('show');
  // Suggestions belong to one image: reopening on another must not show the
  // previous image's titles while the new ones are still being generated.
  if (titlerState.imageId !== img.id) {
    titlerState.imageId = img.id;
    runTitler();
  }
};

const closeTitler = (e) => {
  if (e && e.target !== $('titler-modal')) return;
  $('titler-modal').classList.remove('show');
};

const setTitlerStatus = (text, kind = '') => {
  $('titler-body').innerHTML =
    `<div class="titler-status ${kind}">${ArtRium.escHtml(text)}</div>`;
};

const runTitler = async () => {
  const img = state.modal.image;
  if (!img || titlerState.busy) return;
  titlerState.imageId = img.id;
  titlerState.busy = true;
  $('titler-regen-btn').disabled = true;
  $('titler-btn').classList.add('busy');
  setTitlerStatus('Das Bild wird angeschaut…', 'busy');

  try {
    const r = await apiFetch('/api/titler/run', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ image_id: img.id }),
    });
    const d = await r.json();
    renderTitleSuggestions(d.titles || []);
  } catch (e) {
    setTitlerStatus(e.message || 'Der Titler hat nicht geantwortet.', 'error');
  } finally {
    titlerState.busy = false;
    $('titler-regen-btn').disabled = false;
    $('titler-btn').classList.remove('busy');
  }
};

const renderTitleSuggestions = (titles) => {
  if (!titles.length) {
    setTitlerStatus('Keine Vorschläge zurückbekommen — noch einmal versuchen.', 'error');
    return;
  }
  const list = document.createElement('div');
  list.className = 'titler-list';
  titles.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'title-suggestion';
    btn.type = 'button';
    btn.textContent = t;
    btn.onclick = () => useTitle(t);
    list.appendChild(btn);
  });
  const body = $('titler-body');
  body.innerHTML = '';
  body.appendChild(list);
};

/** Put a suggestion into the title field. Saved with the rest of the modal. */
const useTitle = (title) => {
  $('modal-title').value = title;
  state.modal.dirty = true;
  closeTitler();
  ArtRium.toast('Titel übernommen — noch speichern');
};

// ── Stars ──
const renderStars = (rating) => {
  document.querySelectorAll('.star').forEach(s => {
    const v = parseInt(s.dataset.v);
    s.textContent = rating && v <= rating ? '★' : '☆';
    s.style.color = rating && v <= rating ? 'var(--accent)' : 'var(--text-dim)';
  });
};

const setRating = async (value) => {
  const newRating = state.modal.rating === value ? null : value;
  state.modal.rating = newRating;
  renderStars(newRating);

  try {
    const updated = await patchImage(state.modal.image.id, { rating: newRating });
    state.modal.image.rating = updated.rating;
    refreshGridItem(state.modal.index, updated);
  } catch (e) {
    ArtRium.toast('Could not save rating', true);
  }
};

// ── Tags ──
const renderTags = () => {
  const wrap = $('tags-wrap');
  wrap.querySelectorAll('.tag-chip').forEach(c => c.remove());

  const addWrap = wrap.querySelector('.tag-add-wrap');
  state.modal.tags.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.innerHTML = `<span>${tag}</span>`;
    const rm = document.createElement('button');
    rm.className = 'tag-remove';
    rm.textContent = '×';
    rm.onclick = () => removeTag(tag);
    chip.appendChild(rm);
    wrap.insertBefore(chip, addWrap);
  });
};

const addTag = () => {
  const input = $('tag-input');
  const val = input.value.trim().toLowerCase().replace(/\s+/g, '-');
  if (!val || state.modal.tags.includes(val)) { input.value = ''; return; }
  state.modal.tags.push(val);
  state.modal.dirty = true;
  input.value = '';
  renderTags();
};

const removeTag = (tag) => {
  state.modal.tags = state.modal.tags.filter(t => t !== tag);
  state.modal.dirty = true;
  renderTags();
};

const onTagKey = (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addTag(); }
};

// ── Prompt expand ──
const togglePrompt = () => {
  const el = $('modal-prompt');
  const btn = $('expand-btn');
  el.classList.toggle('expanded');
  btn.textContent = el.classList.contains('expanded') ? 'Show less' : 'Show more';
};

// ── Copy prompt ──
const copyPrompt = async () => {
  const text = state.modal.image?.prompt;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.querySelector('.copy-prompt-btn');
    const prev = btn.textContent;
    btn.textContent = 'Copied!';
    btn.style.color = 'var(--accent)';
    setTimeout(() => { btn.textContent = prev; btn.style.color = ''; }, 1500);
  } catch {
    ArtRium.toast('Could not copy to clipboard', true);
  }
};

// ── Save ──
const saveModal = async (silent = false) => {
  const btn = $('save-btn');
  btn.disabled = true;
  try {
    const updated = await patchImage(state.modal.image.id, {
      title: $('modal-title').value.trim() || null,
      tags:  state.modal.tags,
      notes: $('modal-notes').value.trim() || null,
    });
    state.modal.image.title = updated.title;
    state.modal.image.tags  = updated.tags;
    state.modal.image.notes = updated.notes;
    state.modal.dirty = false;
    refreshGridItem(state.modal.index, updated);
    if (!silent) ArtRium.toast('Saved');
  } catch (e) {
    ArtRium.toast('Save failed: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
};

// ── Delete single (from modal) ──
const confirmDelete = async () => {
  if (!confirm('Delete this image? This cannot be undone.')) return;

  const btn = $('delete-btn');
  btn.disabled = true;
  try {
    await deleteImageApi(state.modal.image.id);
    // The modal stays open on the *next* image, so the button has to come back
    // — re-enabling only in the catch left it dead for every image after the
    // first successful delete.

    const gridItem = $('grid').querySelector(`[data-idx="${state.modal.index}"]`);
    if (gridItem) gridItem.remove();

    state.images.splice(state.modal.index, 1);
    state.offset = Math.max(0, state.offset - 1);
    reindexGrid();
    updateCountBar();

    if (state.images.length === 0) {
      closeModal();
      renderEmpty();
    } else {
      const nextIdx = Math.min(state.modal.index, state.images.length - 1);
      state.modal.dirty = false;
      openModal(nextIdx);
    }
    ArtRium.toast('Deleted');
  } catch (e) {
    ArtRium.toast('Delete failed: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
};

const reindexGrid = () => {
  $('grid').querySelectorAll('.grid-item').forEach((el, i) => {
    el.dataset.idx = i;
    const img = state.images[i];
    el.onclick = () => {
      if (state.selectMode) {
        toggleSelect(el, img.id);
      } else {
        openModal(i);
      }
    };
  });
};

const refreshGridItem = (idx, img) => {
  const el = $('grid').querySelector(`[data-idx="${idx}"]`);
  if (!el) return;
  const badge = el.querySelector('.rating-badge');
  if (badge) {
    badge.className = 'rating-badge' + (img.rating ? ' show' : '');
    badge.textContent = img.rating ? '★'.repeat(img.rating) : '';
  }
  const titleEl = el.querySelector('.grid-title');
  if (titleEl) {
    titleEl.className = 'grid-title' + (img.title ? '' : ' placeholder');
    titleEl.textContent = img.title || 'No title';
  }
  // The thumbnail file is re-cut in place when the enhancement changes, so the
  // src only differs by its version marker — without reassigning it the grid
  // would keep showing the previous rendition from cache.
  const thumbEl = el.querySelector('img');
  if (thumbEl && img.thumb_url) {
    // Compare the attribute, not `.src`: the latter resolves to an absolute
    // URL and would never match, re-fetching the thumbnail on every rating
    // or title save too.
    const next = withAuth(img.thumb_url);
    if (thumbEl.getAttribute('src') !== next) thumbEl.src = next;
  }
};

// ══════════════════════════════════════════════════════════
// VIDEO MODE
// ══════════════════════════════════════════════════════════
let videoMode = false;
let videos = [];
let activeVideo = null;

async function toggleVideoMode(btn) {
  videoMode = !videoMode;
  // De-activate all rating chips when entering video mode
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  if (videoMode) {
    btn.classList.add('active');
    await loadVideos();
  } else {
    // Return to images mode
    document.querySelector('.filter-chip[data-rating=""]').classList.add('active');
    state.filters.ratingMin = '';
    fetchImages(true);
  }
}

async function loadVideos() {
  try {
    const r = await apiFetch('/api/video');
    videos = await r.json();
    renderVideoGrid();
  } catch(e) {
    ArtRium.toast('Failed to load videos: ' + e.message, true);
  }
}

function renderVideoGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  $('grid-footer').style.display = 'none';
  $('count-bar').textContent = videos.length
    ? `${videos.length} video${videos.length === 1 ? '' : 's'}`
    : '';

  if (!videos.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.style.gridColumn = '1/-1';
    empty.innerHTML = '<div class="emoji">🎬</div><p>No videos yet.<br>Generate some in the Video tool.</p>';
    grid.appendChild(empty);
    return;
  }

  for (const v of videos) {
    grid.appendChild(makeVideoGridItem(v));
  }
}

function makeVideoGridItem(v) {
  const div = document.createElement('div');
  div.className = 'video-grid-item';
  div.onclick = () => openVideoDetail(v);

  const wrap = document.createElement('div');
  wrap.className = 'video-thumb-wrap';

  if (v.thumb_url) {
    wrap.innerHTML = `
      <img src="${withAuth(v.thumb_url)}" alt="" loading="lazy">
      <div class="play-badge">▶</div>`;
  } else {
    wrap.innerHTML = `<div class="video-thumb-no-thumb">🎬</div><div class="play-badge">▶</div>`;
  }

  const titleEl = document.createElement('div');
  titleEl.className = 'grid-title' + (v.title ? '' : ' placeholder');
  titleEl.textContent = v.title || 'No title';

  div.appendChild(wrap);
  div.appendChild(titleEl);
  return div;
}

let vdDirty = false;

function openVideoDetail(v) {
  activeVideo = v;
  vdDirty = false;
  const player = $('vd-player');
  player.src = withAuth(v.url);
  player.load();

  $('vd-title').textContent = v.title || 'Video';

  // Title + notes editor (PATCH /api/video/jobs/{id})
  const titleEl = $('vd-title-input');
  const notesEl = $('vd-notes-input');
  titleEl.value = v.title || '';
  notesEl.value = v.notes || '';
  titleEl.oninput = () => { vdDirty = true; };
  notesEl.oninput = () => { vdDirty = true; };

  // Chips: resolution, n_images, frames, fps
  const chips = [
    v.width && v.height ? `${v.width}×${v.height}` : null,
    v.n_images ? `${v.n_images} key frames` : null,
    v.frame_count ? `${v.frame_count} fr/transition` : null,
    v.fps ? `${v.fps} fps` : null,
  ].filter(Boolean);
  $('vd-chips').innerHTML = chips.map(c => `<span class="vd-chip">${c}</span>`).join('');

  const promptEl = $('vd-prompt');
  if (v.prompt) { promptEl.textContent = v.prompt; promptEl.style.display = ''; }
  else            { promptEl.style.display = 'none'; }

  $('vd-date').textContent = new Date(v.created_at).toLocaleDateString('de-DE', {
    day: '2-digit', month: '2-digit', year: '2-digit',
    hour: '2-digit', minute: '2-digit',
  });
  $('vd-download').href = withAuth(v.url);
  $('vd-download').download = v.filename || 'video.mp4';

  $('video-detail-modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

async function saveActiveVideo(silent = false) {
  if (!activeVideo) return;
  const btn = $('vd-save');
  if (btn) btn.disabled = true;
  try {
    const r = await apiFetch(`/api/video/jobs/${activeVideo.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: $('vd-title-input').value,
        notes: $('vd-notes-input').value,
      }),
    });
    const updated = await r.json();
    activeVideo.title = updated.title;
    activeVideo.notes = updated.notes;
    vdDirty = false;

    // Sync local videos cache + refresh the grid card so the title updates
    // in-place without a full reload.
    const idx = videos.findIndex(x => x.id === activeVideo.id);
    if (idx >= 0) {
      videos[idx] = { ...videos[idx], title: updated.title, notes: updated.notes };
      const grid = $('grid');
      const cards = grid.querySelectorAll('.video-grid-item');
      if (cards[idx]) cards[idx].replaceWith(makeVideoGridItem(videos[idx]));
    }
    $('vd-title').textContent = updated.title || 'Video';

    if (!silent) ArtRium.toast('Saved');
  } catch (e) {
    if (!silent) ArtRium.toast('Save failed: ' + e.message, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function closeVideoDetail(e) {
  if (e && e.target !== $('video-detail-modal')) return;
  if (vdDirty) saveActiveVideo(true);
  $('video-detail-modal').classList.remove('show');
  document.body.style.overflow = '';
  const player = $('vd-player');
  player.pause();
  player.src = '';
  activeVideo = null;
  vdDirty = false;
}

async function deleteActiveVideo() {
  if (!activeVideo) return;
  if (!confirm('Delete this video? This cannot be undone.')) return;
  try {
    await apiFetch(`/api/video/${activeVideo.id}`, { method: 'DELETE' });
    ArtRium.toast('Deleted');
    closeVideoDetail();
    await loadVideos();
  } catch(e) {
    ArtRium.toast('Delete failed: ' + e.message, true);
  }
}

// ══════════════════════════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  // The suggestions overlay sits on top of the modal, so it owns the keys
  // while it is open — Escape must close it, not the image behind it.
  if ($('titler-modal').classList.contains('show')) {
    if (e.key === 'Escape') closeTitler();
    return;
  }
  if (!$('modal').classList.contains('open')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape')      closeModal();
  if (e.key === 'ArrowLeft')   navigate(-1);
  if (e.key === 'ArrowRight')  navigate(1);
});

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  $('search-input').addEventListener('input', onSearchInput);
  initEnhanceControls();
  initGrainControls();
  initUpscaleControls();
  fetchImages(true);
  loadLoraLabels();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
});
</script>
