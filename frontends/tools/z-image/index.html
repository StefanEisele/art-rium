// ═══════════════════════════════════════════════════════════════════════════
// SESSION CACHE
// ═══════════════════════════════════════════════════════════════════════════
// The prompt, the model, the LoRA stack and the size are what this tool is;
// losing them to a trip to the Gallery is what this puts right. Generated
// images are NOT in here — they have their own store (`storage`, keyed on
// STORAGE_KEYS.images) and have had one all along.
//
// Split in two on purpose. `restore` runs before anything is built, because
// buildLoraList() fetches the registry for `state.model` and has to know which
// model that is. Everything that depends on a list arriving from the server —
// the LoRA selection, the denoise band, a variant's source picture — is put
// back afterwards by applySessionLate().
const Z_SESSION_KEYS = [
  'mode', 'model', 'imgWidth', 'imgHeight', 'batchCount', 'denoise', 'detail',
  'enhancePhase', 'enhancedPrompts',
];

const zSession = ArtRium.session('z-image', {
  version: 1,
  fields: [DOM_IDS.prompt, DOM_IDS.negativePrompt, DOM_IDS.seed],
  snapshot: () => {
    const d = Object.fromEntries(Z_SESSION_KEYS.map(k => [k, state[k]]));
    d.activeLoras = [...state.activeLoras];
    d.loraStrengths = state.loraStrengths;
    // The picture itself is not cached, only which one it was: it is re-read
    // from the server on the way back, so a variant source that has since been
    // retitled, re-rated or deleted is handled by the same code that handles a
    // deep link to it.
    d.variantSourceId = state.variantSource?.id || null;
    return d;
  },
  restore: (saved) => {
    if (saved.model) state.model = saved.model;
    if (saved.imgWidth)  state.imgWidth  = saved.imgWidth;
    if (saved.imgHeight) state.imgHeight = saved.imgHeight;
    if (saved.batchCount) state.batchCount = saved.batchCount;
    if (typeof saved.denoise === 'number') state.denoise = saved.denoise;
    // Note the shape of this function: it reads each key by name rather than
    // looping Z_SESSION_KEYS, so adding a key to that list only makes it
    // *saved*. A value restored here has to be named here too.
    if (typeof saved.detail === 'number') state.detail = saved.detail;
    $(DOM_IDS.modelZimageBtn).classList.toggle('active', state.model === 'zimage');
    $(DOM_IDS.modelSdxlBtn).classList.toggle('active', state.model === 'sdxl');
    $(DOM_IDS.modelErnieBtn).classList.toggle('active', state.model === 'ernie');
    const sizeBtn = [...document.querySelectorAll('.size-btn')].find(b => {
      const m = /setSize\((\d+),\s*(\d+)/.exec(b.getAttribute('onclick') || '');
      return m && Number(m[1]) === state.imgWidth && Number(m[2]) === state.imgHeight;
    });
    if (sizeBtn) selectButton('.size-btn', sizeBtn);
    updateNegativePromptVisibility();
    updateDetailVisibility();
    // The options fetch has not landed yet, so this only puts the handle
    // and the number back; the band labels arrive with loadDenoiseOptions.
    syncDetailSlider();
  },
});

/** The half of the restore that needs the server's lists to have landed. */
const applySessionLate = async (saved) => {
  if (!saved || !saved.state) return;
  const s = saved.state;

  // The batch row is built after restore() runs, so its highlight is set here.
  const batchBtns = document.querySelectorAll('.batch-btn');
  batchBtns.forEach((b, i) => b.classList.toggle('active', i + 1 === state.batchCount));

  // setMode() rewrites the prompt textarea (it moves the LoRA trigger in and
  // out), so it has to run before the cached prompt is put back — and it
  // early-returns when the mode already matches, which is the Direct case.
  const promptText = $(DOM_IDS.prompt).value;
  if (s.mode && s.mode !== state.mode) setMode(s.mode);
  if (promptText) { $(DOM_IDS.prompt).value = promptText; onPromptInput(); }

  // buildLoraList() has just reset the selection to the registry's default.
  // Only names it still offers: a LoRA dropped from the library would fail
  // the whole submission rather than be quietly ignored.
  if (s.activeLoras) {
    const known = new Set(loraRegistry.list.map(l => l.filename));
    state.activeLoras = new Set(s.activeLoras.filter(f => known.has(f)));
    Object.assign(state.loraStrengths, s.loraStrengths || {});
    renderLoraState();
  }

  if (s.mode === 'variant' && s.variantSourceId) {
    try {
      const r = await apiFetch(`/api/images/${encodeURIComponent(s.variantSourceId)}`);
      setVariantSource(await r.json());
      // setVariantSource() puts the source's own prompt back and snaps the
      // slider to the recommended band — both of which throw away an edit
      // that was the entire point of coming back to this.
      if (promptText) { $(DOM_IDS.prompt).value = promptText; onPromptInput(); }
      if (typeof s.denoise === 'number') { state.denoise = s.denoise; renderDenoise(); }
    } catch (_) {
      // The source is gone. Direct mode with the prompt still in the box is a
      // better landing than a variant panel pointing at nothing.
      setMode('direct');
    }
  }

  // A reviewed set of enhanced prompts is real work — several seconds of LLM
  // and a read-through — so it comes back rather than sending you round again.
  if (s.mode === 'enhance' && s.enhancePhase === 'review' && s.enhancedPrompts?.length) {
    state.enhancedPrompts = s.enhancedPrompts;
    state.enhancePhase = 'review';
    renderEnhanceReview();
  }
  updateGenButton();
  updateAdvSummary();
};

function resetSession() {
  if (!confirm('Reset the form?\n\nPrompt, model, LoRAs and settings are cleared. Generated images stay.')) return;
  zSession.reset();
}

const buildLoraList = async () => {
  const row = $(DOM_IDS.loraRow);
  row.innerHTML = '';
  let payload;
  try {
    const res = await fetch(withAuth(`/api/loras?model=${state.model}`), { headers: getAuthHeaders() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    payload = await res.json();
  } catch (e) {
    row.textContent = 'Could not load LoRAs.';
    console.error('Failed to load LoRAs:', e);
    return;
  }

  loraRegistry.list = payload.loras || [];
  const defaultFilename = payload.default || (loraRegistry.list[0] && loraRegistry.list[0].filename) || '';
  state.activeLoras = new Set(defaultFilename ? [defaultFilename] : []);
  state.loraStrengths = {};
  loraRegistry.list.forEach(l => { state.loraStrengths[l.filename] = 0.5; });

  // Models with no LoRA in the library (e.g. Ernie Turbo) hide the field
  // entirely rather than showing an empty row.
  const hasLoras = loraRegistry.list.length > 0;
  $(DOM_IDS.loraField).classList.toggle('hidden', !hasLoras);

  loraRegistry.list.forEach((l, i) => {
    const item = document.createElement('div');
    item.className = 'lora-item' + (state.activeLoras.has(l.filename) ? ' active' : '');
    item.id = `lora-item-${i}`;

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'lora-toggle';
    toggle.innerHTML = `<span class="lora-check">✓</span><span>${l.label}<small>${l.trigger}</small></span>`;
    toggle.onclick = () => toggleLora(l.filename, i);

    const strengthRow = document.createElement('div');
    strengthRow.className = 'lora-item-strength';
    const slider = document.createElement('input');
    slider.type = 'range'; slider.min = '0'; slider.max = '1'; slider.step = '0.05';
    slider.value = String(state.loraStrengths[l.filename]);
    slider.oninput = (e) => onLoraStrength(l.filename, e.target.value, i);
    const val = document.createElement('span');
    val.className = 'strength-val';
    val.id = `lora-strength-val-${i}`;
    val.textContent = state.loraStrengths[l.filename].toFixed(2);
    strengthRow.append(slider, val);

    item.append(toggle, strengthRow);
    row.appendChild(item);
    updateAdvSummary();
  });
};

/** `?variant=<image_id>` — the gallery's "Varianten" button lands here with a
 *  picture already chosen, so the tool opens in variant mode on that image
 *  instead of making the user find it again in the picker. */
const applyVariantDeepLink = async () => {
  const id = new URLSearchParams(location.search).get('variant');
  if (!id) return;
  setMode('variant');
  try {
    const r = await apiFetch(`/api/images/${encodeURIComponent(id)}`);
    setVariantSource(await r.json());
  } catch (e) {
    ArtRium.toast('Quellbild konnte nicht geladen werden.', true);
  }
  // Drop the param so a reload does not re-pick over a changed selection.
  history.replaceState(null, '', location.pathname);
};

// Which model made a picture, as this tool's own toggle names it. Anything
// unrecognised (including the two Z-Image graphs) is Z-Image Turbo.
const MODEL_BY_WORKFLOW = {
  'artivision_xl': 'sdxl',
  'ernie_image_turbo': 'ernie',
};

/** `?from=<image_id>` — the gallery's "Weiterarbeiten" button. Not the
 *  picture, its recipe: prompt, model, size, seed and LoRA stack are put back
 *  the way they were, and the tool opens in Direct mode ready to generate
 *  something new from the same place. */
const applyContinueDeepLink = async () => {
  const id = new URLSearchParams(location.search).get('from');
  if (!id) return;
  history.replaceState(null, '', location.pathname);

  let img;
  try {
    const r = await apiFetch(`/api/images/${encodeURIComponent(id)}`);
    img = await r.json();
  } catch (e) {
    ArtRium.toast('Bild konnte nicht geladen werden.', true);
    return;
  }

  setMode('direct');
  // Before the LoRAs: switching models refetches the registry and resets the
  // active set to that model's default.
  const model = MODEL_BY_WORKFLOW[img.workflow_name] || 'zimage';
  if (model !== state.model) await setModel(model);

  $(DOM_IDS.prompt).value = img.prompt || '';
  onPromptInput();

  // Only a size the tool actually offers — a variant carries whatever its
  // source had, and a button set that matches nothing would be a lie.
  const sizeBtn = [...document.querySelectorAll('.size-btn')].find(b => {
    const m = /setSize\((\d+),\s*(\d+)/.exec(b.getAttribute('onclick') || '');
    return m && Number(m[1]) === img.width && Number(m[2]) === img.height;
  });
  if (sizeBtn) setSize(img.width, img.height, sizeBtn);

  // The seed comes along, so the next run starts from the same roll. It is
  // named on the Advanced fold's summary line even while that stays closed.
  if (img.seed !== null && img.seed !== undefined) {
    $(DOM_IDS.seed).value = String(img.seed);
  }

  const known = new Set(loraRegistry.list.map(l => l.filename));
  const carried = (img.loras || []).filter(l => known.has(l.name));
  if (carried.length) {
    state.activeLoras = new Set(carried.map(l => l.name));
    carried.forEach(l => { state.loraStrengths[l.name] = l.strength; });
    renderLoraState();
  }

  // The detail dial is part of the recipe too: continuing from a picture that
  // was sampled at +1.2 and silently starting from 0 would hand back a
  // materially different render off an otherwise identical setup.
  state.detail = typeof img.detail_amount === 'number' ? img.detail_amount : 0;
  syncDetailSlider();

  updateAdvSummary();
  const bits = [`${img.width}×${img.height}`];
  if (img.seed !== null && img.seed !== undefined) bits.push(`Seed ${img.seed}`);
  if (carried.length) bits.push(carried.length === 1 ? '1 LoRA' : `${carried.length} LoRAs`);
  if (state.detail) bits.push(`Detail ${state.detail > 0 ? '+' : ''}${state.detail}`);
  ArtRium.toast(`Übernommen: Prompt · ${bits.join(' · ')}`);
};

window.addEventListener('load', async () => {
  // First, so buildLoraList() below fetches the registry for the model that
  // was actually in use rather than the default one.
  const savedSession = zSession.load();
  buildBatchRow();
  buildHeaderButtons();
  await buildLoraList();
  // Awaited: the deep link below snaps the slider into the recommended band,
  // which needs the ranges to already be here.
  await loadDenoiseOptions();
  await applySessionLate(savedSession);
  // After the session restore, which may have brought a different model back
  // with it — the dial only belongs to the Z-Image graphs.
  updateDetailVisibility();
  state.generatedImages = storage.loadImages();
  gallery.render();

  // Prepend default LoRA trigger word(s) if prompt is empty
  const promptEl = $(DOM_IDS.prompt);
  if (!promptEl.value.trim()) {
    promptEl.value = combinedTrigger();
    onPromptInput();
  }

  let _pickerSearchTimer;
  $(DOM_IDS.pickerSearch).addEventListener('input', (e) => {
    clearTimeout(_pickerSearchTimer);
    state.pickerSearch = e.target.value;
    _pickerSearchTimer = setTimeout(() => loadPickerImages(true), 350);
  });
  $(DOM_IDS.pickerGrid).addEventListener('scroll', () => {
    const el = $(DOM_IDS.pickerGrid);
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 80) loadPickerImages(false);
  });

  await applyVariantDeepLink();
  await applyContinueDeepLink();
  zSession.start();
  initLightboxSwipe();

  wsConn = ArtRium.connectWs({
    clientId:      state.clientId,
    getApiKey:     () => state.apiKey,
    onMessage:     handleMsg,
    onConnecting:  () => setStatus('connecting'),
    onConnected:   () => setStatus('connected'),
    onDisconnected:() => setStatus('disconnected'),
    on4001: () => {
      state.apiKey = '';
      ArtRium.clearApiKey();
      location.href = '/';
    },
  });

  ArtRium.registerSw();
});
</script>
</body>
</html>
